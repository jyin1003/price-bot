<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Price Bot{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f0f11;
      --surface:    #17171a;
      --surface2:   #1e1e22;
      --border:     #2a2a30;
      --border2:    #363640;
      --text:       #e8e8ec;
      --muted:      #b9b9cd;
      --muted2:     #888893;
      --accent:     #e8c468;
      --green:      #4ade80;
      --green-dim:  #1a3d28;
      --amber:      #fb923c;
      --amber-dim:  #3d2010;
      --red:        #f87171;
      --red-dim:    #3d1515;
      --mono:       'DM Mono', monospace;
      --sans:       'DM Sans', sans-serif;
      --radius:     6px;
    }

    html { font-size: 16px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Nav ──────────────────────────────────────────── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      font-family: var(--mono);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .nav-divider { width: 1px; height: 20px; background: var(--border); }
    .nav-links { display: flex; gap: 0.25rem; align-items: center; flex: 1; overflow-x: auto; }
    .nav-link {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      text-decoration: none;
      padding: 0.3rem 0.6rem;
      border-radius: var(--radius);
      white-space: nowrap;
      transition: color 0.15s, background 0.15s;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .nav-link:hover { color: var(--text); background: var(--surface2); }
    .nav-link.active { color: var(--accent); background: var(--surface2); }

    /* ── Layout ───────────────────────────────────────── */
    .page { max-width: 1400px; margin: 0 auto; padding: 2rem; }

    /* ── Search / Filter bar ──────────────────────────── */
    .toolbar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-wrap { position: relative; flex: 1; min-width: 240px; }
    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.9rem;
      pointer-events: none;
    }
    input[type="search"], input[type="text"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.8rem;
      padding: 0.55rem 0.75rem 0.55rem 2.2rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="search"]:focus, input[type="text"]:focus {
      border-color: var(--accent);
    }
    input[type="search"]::placeholder { color: var(--muted2); }
    select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 0.55rem 0.75rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    select:focus { border-color: var(--accent); }

    /* ── Status badges ────────────────────────────────── */
    .badge {
      font-family: var(--mono);
      font-size: 0.65rem;
      font-weight: 500;
      padding: 0.2rem 0.45rem;
      border-radius: 3px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .badge-cheapest   { background: var(--green-dim);  color: var(--green); }
    .badge-discounted { background: var(--amber-dim);  color: var(--amber); }
    .badge-full       { background: var(--surface2);   color: var(--muted); border: 1px solid var(--border); }

    /* ── Vendor pill ──────────────────────────────────── */
    .vendor-pill {
      font-family: var(--mono);
      font-size: 0.65rem;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }
    .vendor-pill.woolworths  { border-color: #1a5e2a; color: #4ade80; background: #0e2a15; }
    .vendor-pill.coles       { border-color: #5e1a1a; color: #f87171; background: #2a0e0e; }
    .vendor-pill.chemist_warehouse { border-color: #1a3d5e; color: #60a5fa; background: #0e1f2a; }
    .vendor-pill.skin_seoul  { border-color: #3d1a5e; color: #c084fc; background: #1f0e2a; }

    /* ── Section headings ─────────────────────────────── */
    .section-label {
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Product card / row ───────────────────────────── */
    .product-row {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 0.75rem;
      align-items: center;
      padding: 0.65rem 0.9rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      transition: border-color 0.15s, background 0.15s;
      cursor: default;
      position: relative;
    }
    .product-row:hover { border-color: var(--border2); background: var(--surface2); }
    .product-row.is-group { cursor: pointer; }
    .product-row.is-group:hover .row-name { color: var(--accent); }

    .row-name {
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--text);
      transition: color 0.15s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }
    .row-name-text { 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .expand-icon {
      color: var(--muted2);
      font-size: 0.7rem;
      flex-shrink: 0;
      transition: transform 0.2s;
    }
    .product-row.expanded .expand-icon { transform: rotate(90deg); }

    .row-price {
      font-family: var(--mono);
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text);
      text-align: right;
      white-space: nowrap;
    }
    .row-updated {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted2);
      text-align: right;
      white-space: nowrap;
    }

    /* ── Members (expandable) ─────────────────────────── */
    .members-wrap {
      display: none;
      margin-top: 0.4rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .members-wrap.open { display: block; }

    .member-row {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 0.75rem;
      align-items: center;
      padding: 0.5rem 0.9rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: relative;
    }
    .member-row:last-child { border-bottom: none; }
    .member-row:hover { background: var(--surface); }

    .member-name {
      font-size: 0.78rem;
      color: var(--text);
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .member-price {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--text);
      text-align: right;
      white-space: nowrap;
    }
    .member-updated {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--muted2);
      text-align: right;
      white-space: nowrap;
    }

    /* ── Tooltip ──────────────────────────────────────── */
    .tooltip {
      position: absolute;
      z-index: 200;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.12s, transform 0.12s;
      min-width: 180px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      white-space: nowrap;
    }
    .tooltip.visible { opacity: 1; transform: translateY(0); }
    .tooltip-row { display: flex; justify-content: space-between; gap: 1.5rem; margin-bottom: 0.25rem; }
    .tooltip-row:last-child { margin-bottom: 0; }
    .tooltip-label { color: var(--muted); }
    .tooltip-val-hi { color: var(--red); }
    .tooltip-val-lo { color: var(--green); }

    /* ── Discount bar ─────────────────────────────────── */
    .discount-pct {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--amber);
    }
    .discount-pct.zero { color: var(--muted2); }

    /* ── Category section (dashboard) ────────────────── */
    .cat-section { margin-bottom: 3.5rem; }
    .cat-header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .cat-title {
      font-family: var(--mono);
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .cat-title:hover { text-decoration: underline; text-underline-offset: 3px; }
    .cat-count {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

    .mini-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }

    /* ── Table header ─────────────────────────────────── */
    .col-header {
      display: grid;
      gap: 0.75rem;
      padding: 0 0.9rem 0.4rem;
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .group-item { margin-bottom: 0.35rem; }
    .group-item:last-child { margin-bottom: 0; }

    /* ── Page title ───────────────────────────────────── */
    .page-title {
      font-family: var(--mono);
      font-size: 1.4rem;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }
    .page-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    /* ── Hidden for filter ────────────────────────────── */
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-brand">⬡ Price Bot</a>
    <div class="nav-divider"></div>
    <div class="nav-links">
      {% block nav_links %}{% endblock %}
    </div>
  </nav>

  {% block body %}{% endblock %}

  <script>
    // ── Shared tooltip logic ───────────────────────────────────────────────
    let activeTooltip = null;

    function createTooltip(maxPrice, minPrice) {
      const tip = document.createElement('div');
      tip.className = 'tooltip';
      const fmt = v => v != null ? `$${parseFloat(v).toFixed(2)}` : '—';
      tip.innerHTML = `
        <div class="tooltip-row">
          <span class="tooltip-label">all-time high</span>
          <span class="tooltip-val-hi">${fmt(maxPrice)}</span>
        </div>
        <div class="tooltip-row">
          <span class="tooltip-label">all-time low</span>
          <span class="tooltip-val-lo">${fmt(minPrice)}</span>
        </div>
      `;
      return tip;
    }

    function attachTooltip(el, maxPrice, minPrice) {
      if (maxPrice == null && minPrice == null) return;
      let tip = null;

      el.addEventListener('mouseenter', (e) => {
        if (tip) tip.remove();
        tip = createTooltip(maxPrice, minPrice);
        document.body.appendChild(tip);
        positionTooltip(tip, el);
        requestAnimationFrame(() => tip.classList.add('visible'));
        activeTooltip = tip;
      });

      el.addEventListener('mousemove', (e) => {
        if (tip) positionTooltip(tip, el);
      });

      el.addEventListener('mouseleave', () => {
        if (tip) { tip.remove(); tip = null; activeTooltip = null; }
      });
    }

    function positionTooltip(tip, anchor) {
      const rect = anchor.getBoundingClientRect();
      const tw = tip.offsetWidth;
      const th = tip.offsetHeight;
      let left = rect.left + window.scrollX;
      let top  = rect.top + window.scrollY - th - 8;
      if (left + tw > window.innerWidth - 10) left = window.innerWidth - tw - 10;
      if (top < 0) top = rect.bottom + window.scrollY + 8;
      tip.style.left = left + 'px';
      tip.style.top  = top + 'px';
    }

    // ── Expand / collapse groups ───────────────────────────────────────────
    document.addEventListener('click', (e) => {
      const row = e.target.closest('.is-group');
      if (!row) return;
      const wrap = row.nextElementSibling;
      if (!wrap || !wrap.classList.contains('members-wrap')) return;
      const open = wrap.classList.toggle('open');
      row.classList.toggle('expanded', open);
    });

    // ── Search filter ──────────────────────────────────────────────────────
    function initSearch(inputId, itemSelector) {
      const input = document.getElementById(inputId);
      if (!input) return;
      input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        document.querySelectorAll(itemSelector).forEach(item => {
          const text = item.textContent.toLowerCase();
          item.classList.toggle('hidden', q.length > 0 && !text.includes(q));
        });
      });
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
